server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # SPA fallback untuk semua /shop/* route (react-router)
    # POS nginx sudah proxy /shop/* ke container ini.
    location /shop/ {
        try_files $uri $uri/ /shop/index.html;
    }

    # Static assets Vite pakai hashed filename — safe long cache.
    location ~* /shop/assets/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html no-cache supaya SPA fallback ambil versi terbaru selalu.
    location = /shop/index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }
}
